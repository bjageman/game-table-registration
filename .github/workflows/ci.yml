name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tables
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tables
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tables" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tables:test@localhost/tables
      TEST_DATABASE_URL: postgresql+psycopg://tables:test@localhost/tables
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy backend/app
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8080/api/health/ready && curl --fail http://localhost:8080/
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()
  required:
    if: always()
    needs: [backend, frontend, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
