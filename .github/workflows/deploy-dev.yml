name: Deploy to Dev
on:
  push:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd /tank/apps/docker/vibes/game-table-registration
            git fetch origin dev:refs/remotes/origin/dev
            git show origin/dev:scripts/deploy.sh | DEPLOY_REPO="$PWD" bash -s -- dev
