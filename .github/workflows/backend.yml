name: Backend CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tables
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tables
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tables" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tables:test@localhost/tables
      TEST_DATABASE_URL: postgresql+psycopg://tables:test@localhost/tables
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv==0.13.6
          uv sync --frozen
      - name: Lint, format, and type checks
        run: |
          uv run ruff check backend
          uv run ruff format --check backend
          uv run mypy backend/app
      - name: Check migrations and rollback
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest
      - name: Audit installed dependencies for known vulnerabilities
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start services and check readiness
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail http://localhost:8000/api/health/ready
      - name: Show service logs on failure
        run: docker compose logs
        if: failure()
      - name: Remove test services and volumes
        run: docker compose down -v
        if: always()
