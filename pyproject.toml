[project]
name = "game-table-registration"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "discord-py>=2.7.1",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "reportlab>=5.1.0,<6",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-reportlab>=5.1.0.20261104",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
faulthandler_timeout = 60

[tool.ruff]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "backend"
strict = true
